# Etiquetado automático de Pull Requests según carpetas tocadas
# Requiere que las etiquetas existan previamente en labels.yml

"module:portafolio":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/src/app/**/portfolio/**"
          - "frontend/src/app/**/portafolio/**"
          - "frontend/src/components/**/portfolio/**"
          - "frontend/src/components/**/Portfolio*"
          - "frontend/src/server/repositories/portafolio*"
          - "frontend/src/server/services/portafolio*"
          - "frontend/src/types/**/portfolio*"

"module:estudio":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/src/app/**/studio/**"
          - "frontend/src/app/**/booking/**"
          - "frontend/src/app/**/reservas/**"
          - "frontend/src/components/**/studio/**"
          - "frontend/src/components/**/Studio*"
          - "frontend/src/components/**/Booking*"
          - "frontend/src/server/repositories/reservas*"
          - "frontend/src/server/repositories/servicios*"
          - "frontend/src/server/repositories/inventario*"
          - "frontend/src/server/services/reservas*"
          - "frontend/src/types/**/reserva*"

"module:leads":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/src/app/**/contact/**"
          - "frontend/src/app/api/leads/**"
          - "frontend/src/components/**/Contact*"
          - "frontend/src/server/repositories/leads*"
          - "frontend/src/server/services/leads*"
          - "frontend/src/server/notifications/**"

"module:social":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/src/app/**/social/**"
          - "frontend/src/components/**/Social*"
          - "frontend/src/app/api/social/**"
          - "frontend/src/server/repositories/solicitudes*"
          - "frontend/src/server/services/solicitudes*"

"module:infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "supabase/**"
          - "docs/**"
          - "docker/**"
          - "compose*.yml"
          - "Dockerfile*"
          - "*.config.*"
          - "frontend/package*.json"
          - "frontend/.env*"
          - "frontend/src/server/supabase/**"
          - "frontend/src/lib/**"

"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

"type:test":
  - changed-files:
      - any-glob-to-any-file:
          - "**/__tests__/**"
          - "**/*.test.*"
          - "**/*.spec.*"
          - "tests/**"
