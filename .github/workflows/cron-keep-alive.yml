name: Mantener base de datos activa

# Supabase en capa gratuita pausa proyectos inactivos tras una semana sin uso.
# Esta tarea envía una petición mínima periódica para evitar la suspensión.
# NOTA: En GitHub Actions, schedule solo dispara desde la rama por defecto (develop/main).

on:
  schedule:
    - cron: "0 12 */3 * *" # Ejecución cada 3 días a las 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    name: Ping a Supabase REST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Validar configuración de secretos
        if: env.SUPABASE_URL == '' || env.ANON_KEY == ''
        run: |
          echo "Secretos de Supabase no configurados en Settings > Secrets and variables > Actions. Se omite el ping." >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar petición de actividad
        if: env.SUPABASE_URL != '' && env.ANON_KEY != ''
        run: |
          curl -sS --fail-with-body "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}"