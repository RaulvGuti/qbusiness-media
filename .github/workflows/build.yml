name: Build de contenedores

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "compose*.yml"
      - "**/Dockerfile"
      - "docker/**"
      - "package*.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-compose:
    name: Validar sintaxis y build de Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar archivo de entorno temporal
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/qbusiness" > .env
          fi

      - name: Validar configuración de docker-compose
        run: docker compose config

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imágenes del proyecto
        run: docker compose build

      - name: Limpiar contenedores y volúmenes residuales
        if: always()
        run: docker compose down -v --remove-orphans