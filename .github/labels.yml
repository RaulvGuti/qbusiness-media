# Catálogo de etiquetas - Fuente de verdad del repositorio QBusiness Media
# Aplicar con script o CLI de GitHub (gh label create)

# --- Tipo: Clase de tarea ---
- name: "type:feature"
  color: "0e8a16"
  description: "Nueva funcionalidad"
- name: "type:bug"
  color: "d73a4a"
  description: "Error o comportamiento inesperado"
- name: "type:security"
  color: "b60205"
  description: "Vulnerabilidad o exposición de datos"
- name: "type:refactor"
  color: "5319e7"
  description: "Reorganización sin cambio funcional"
- name: "type:perf"
  color: "fbca04"
  description: "Mejoras de rendimiento"
- name: "type:test"
  color: "1d76db"
  description: "Pruebas unitarias o de integración"
- name: "type:docs"
  color: "0075ca"
  description: "Cambios en documentación"
- name: "type:chore"
  color: "cfd3d7"
  description: "Dependencias, tooling y configuración"

# --- Módulos: Dominio de QBusiness Media ---
- name: "module:portafolio"
  color: "c2e0c6"
  description: "Galería de imágenes, videos vertical/horizontal y filtros"
- name: "module:estudio"
  color: "c2e0c6"
  description: "Renta de estudio, calendario, tarifas y equipo extra"
- name: "module:leads"
  color: "c2e0c6"
  description: "Captación comercial, correos y enlaces a WhatsApp"
- name: "module:social"
  color: "c2e0c6"
  description: "Solicitudes de apoyo para fundaciones y bomberos"
- name: "module:infra"
  color: "c2e0c6"
  description: "Docker, Supabase, Prisma, variables de entorno y CI/CD"

# --- Prioridad ---
- name: "priority:critica"
  color: "b60205"
  description: "Bloqueante o afecta seguridad. Atención inmediata"
- name: "priority:alta"
  color: "d93f0b"
  description: "Prioridad alta para el hito actual"
- name: "priority:media"
  color: "fbca04"
  description: "Planificable en el sprint regular"
- name: "priority:baja"
  color: "0e8a16"
  description: "Mejora secundaria o backlog"

# --- Estado ---
- name: "status:bloqueado"
  color: "000000"
  description: "Bloqueado por otra tarea o dependencia externa"
- name: "status:necesita-decision"
  color: "d876e3"
  description: "Requiere decisión de diseño o del cliente"
- name: "status:en-progreso"
  color: "0e8a16"
  description: "Asignado y en desarrollo"
- name: "status:duplicada"
  color: "cfd3d7"
  description: "Ya existe otra issue relacionada"
- name: "status:no-se-hara"
  color: "ffffff"
  description: "Descartado a propósito"

# --- Automatizaciones y releases ---
- name: "epic"
  color: "3e4b9e"
  description: "Agrupa varias tareas"
- name: "dependencies"
  color: "0366d6"
  description: "Actualizaciones gestionadas por Dependabot"
- name: "breaking-change"
  color: "b60205"
  description: "Cambio con ruptura de compatibilidad"